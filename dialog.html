<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessibility Checking Agent</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Backdrop behind dialog */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow-y: auto;
    }

    /* Dialog container */
    [role="dialog"] {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* Header */
    .dialog-header {
      background: #1a56db;
      color: #ffffff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dialog-header svg {
      flex-shrink: 0;
    }

    .dialog-title {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Body */
    .dialog-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .dialog-description {
      font-size: 0.875rem;
      color: #4b5563;
      line-height: 1.5;
    }

    /* URL input group */
    .url-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .url-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #111827;
    }

    .url-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 0.9375rem;
      color: #111827;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .url-input:focus {
      outline: none;
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.2);
    }

    .url-input[aria-invalid="true"] {
      border-color: #dc2626;
    }

    .url-error {
      font-size: 0.8125rem;
      color: #dc2626;
      display: none;
    }

    .url-error[aria-hidden="false"] {
      display: block;
    }

    /* Checkbox group */
    fieldset {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 4px 0;
    }

    legend {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      padding: 0 16px;
      margin-bottom: 4px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .check-item:hover {
      background: #eff6ff;
    }

    /* Divider between items */
    .check-item + .check-item {
      border-top: 1px solid #f3f4f6;
    }

    /* Custom checkbox */
    .check-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #9ca3af;
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      background: #fff;
      transition: border-color 0.15s, background 0.15s;
    }

    .check-item input[type="checkbox"]:checked {
      background: #1a56db;
      border-color: #1a56db;
    }

    .check-item input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 0px;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .check-item input[type="checkbox"]:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .check-item label {
      font-size: 0.9375rem;
      color: #111827;
      cursor: pointer;
      flex: 1;
      line-height: 1.4;
    }

    .check-item label .label-hint {
      display: block;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Footer */
    .dialog-footer {
      padding: 16px 24px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 9px 20px;
      border-radius: 7px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .btn:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .btn-primary {
      background: #1a56db;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1648c0;
      box-shadow: 0 2px 8px rgba(26, 86, 219, 0.4);
    }

    .btn-primary:disabled {
      background: #93c5fd;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Results section */
    .results-section {
      border-top: 1px solid #e5e7eb;
      padding: 20px 24px 24px;
    }

    .results-section[hidden] {
      display: none;
    }

    .results-heading {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .results-url {
      font-size: 0.8125rem;
      color: #4b5563;
      margin-bottom: 14px;
      word-break: break-all;
    }

    .results-url strong {
      color: #111827;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .result-card {
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .result-card__count {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .result-card__label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-card--error {
      background: #fef2f2;
    }
    .result-card--error .result-card__count { color: #dc2626; }
    .result-card--error .result-card__label { color: #b91c1c; }

    .result-card--contrast {
      background: #fff7ed;
    }
    .result-card--contrast .result-card__count { color: #ea580c; }
    .result-card--contrast .result-card__label { color: #c2410c; }

    .result-card--alert {
      background: #fefce8;
    }
    .result-card--alert .result-card__count { color: #ca8a04; }
    .result-card--alert .result-card__label { color: #a16207; }

    .result-card--feature {
      background: #f0fdf4;
    }
    .result-card--feature .result-card__count { color: #16a34a; }
    .result-card--feature .result-card__label { color: #15803d; }

    .result-card--structure {
      background: #eff6ff;
    }
    .result-card--structure .result-card__count { color: #2563eb; }
    .result-card--structure .result-card__label { color: #1d4ed8; }

    .result-card--aria {
      background: #faf5ff;
    }
    .result-card--aria .result-card__count { color: #9333ea; }
    .result-card--aria .result-card__label { color: #7e22ce; }

    .results-credits {
      font-size: 0.8125rem;
      color: #6b7280;
      text-align: right;
    }

    .results-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.875rem;
      color: #b91c1c;
    }

    /* Live region for status announcements */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="dialog-backdrop">
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-desc"
    >

      <!-- Header -->
      <div class="dialog-header">
        <svg
          aria-hidden="true"
          focusable="false"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4l3 3"/>
        </svg>
        <h1 class="dialog-title" id="dialog-title">Accessibility Checking Agent</h1>
      </div>

      <!-- Body -->
      <div class="dialog-body">
        <p class="dialog-description" id="dialog-desc">
          Enter the URL of the page to audit, select one or more checks, then click
          <strong>Run Checks</strong>. Results appear below via the WAVE API.
        </p>

        <!-- URL input -->
        <div class="url-group">
          <label class="url-label" for="url-input">Page URL to audit</label>
          <input
            type="url"
            id="url-input"
            class="url-input"
            placeholder="https://example.com"
            autocomplete="url"
            aria-describedby="url-error"
            aria-required="true"
          />
          <span id="url-error" class="url-error" role="alert" aria-hidden="true">
            Please enter a valid URL starting with https:// or http://
          </span>
        </div>

        <fieldset>
          <legend>Accessibility Tests</legend>

          <div class="check-item">
            <input type="checkbox" id="chk-color-contrast" name="checks" value="color-contrast" checked />
            <label for="chk-color-contrast">
              Color Contrast
              <span class="label-hint">Verifies text meets WCAG AA/AAA contrast ratios (SC 1.4.3, 1.4.6)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-keyboard-traps" name="checks" value="keyboard-traps" />
            <label for="chk-keyboard-traps">
              Keyboard Traps
              <span class="label-hint">Ensures focus is never locked inside a component (SC 2.1.2)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-alt-text" name="checks" value="alt-text" />
            <label for="chk-alt-text">
              Alt-text for Images
              <span class="label-hint">Checks that all &lt;img&gt; elements have meaningful alt attributes (SC 1.1.1)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-desc-images" name="checks" value="desc-images" />
            <label for="chk-desc-images">
              Description for Images
              <span class="label-hint">Validates long descriptions for complex images via aria-describedby (SC 1.1.1)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-skip-link" name="checks" value="skip-link" />
            <label for="chk-skip-link">
              Skip to Content Link
              <span class="label-hint">Confirms a visible skip-navigation link is the first focusable element (SC 2.4.1)</span>
            </label>
          </div>
        </fieldset>
      </div>

      <!-- Footer -->
      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-run">Run Checks</button>
      </div>

      <!-- Results -->
      <section class="results-section" id="results-section" aria-labelledby="results-heading" hidden>
        <h2 class="results-heading" id="results-heading">Results</h2>
        <div id="results-content"></div>
      </section>

    </div>
  </div>

  <!-- Live region: screen readers announce status changes -->
  <div aria-live="polite" aria-atomic="true" class="sr-only" id="status"></div>

  <script>
    const checkboxes = document.querySelectorAll('input[name="checks"]');
    const runBtn = document.getElementById('btn-run');
    const cancelBtn = document.getElementById('btn-cancel');
    const status = document.getElementById('status');
    const urlInput = document.getElementById('url-input');
    const urlError = document.getElementById('url-error');
    const resultsSection = document.getElementById('results-section');
    const resultsContent = document.getElementById('results-content');

    const PROXY_URL = 'http://127.0.0.1:5000/check';

    // Keep Run button disabled when nothing is selected
    function updateRunButton() {
      const anyChecked = [...checkboxes].some(cb => cb.checked);
      runBtn.disabled = !anyChecked;
    }

    checkboxes.forEach(cb => cb.addEventListener('change', updateRunButton));
    updateRunButton();

    function validateUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function setUrlValid(valid) {
      urlInput.setAttribute('aria-invalid', valid ? 'false' : 'true');
      urlError.setAttribute('aria-hidden', valid ? 'true' : 'false');
    }

    urlInput.addEventListener('input', () => {
      if (urlInput.value) setUrlValid(validateUrl(urlInput.value));
    });

    function renderResults(data) {
      if (!data.status || !data.status.success) {
        resultsContent.innerHTML = `
          <p class="results-error">
            WAVE API error: ${data.status?.error || 'Unknown error'}
          </p>`;
        return;
      }

      const cats = data.categories;
      const stats = data.statistics;

      const cards = [
        { key: 'error',     cls: 'error',     label: 'Errors' },
        { key: 'contrast',  cls: 'contrast',  label: 'Contrast' },
        { key: 'alert',     cls: 'alert',     label: 'Alerts' },
        { key: 'feature',   cls: 'feature',   label: 'Features' },
        { key: 'structure', cls: 'structure', label: 'Structure' },
        { key: 'aria',      cls: 'aria',      label: 'ARIA' },
      ];

      const grid = cards.map(({ key, cls, label }) => {
        const count = cats[key]?.count ?? 0;
        return `
          <div class="result-card result-card--${cls}" role="group" aria-label="${label}: ${count}">
            <div class="result-card__count" aria-hidden="true">${count}</div>
            <div class="result-card__label" aria-hidden="true">${label}</div>
          </div>`;
      }).join('');

      resultsContent.innerHTML = `
        <p class="results-url">
          <strong>Scanned:</strong> ${escHtml(stats.pageurl)}
        </p>
        <div class="results-grid" role="list" aria-label="Issue counts by category">
          ${grid}
        </div>
        <p class="results-credits">${stats.creditsremaining} API credit${stats.creditsremaining !== 1 ? 's' : ''} remaining</p>`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    runBtn.addEventListener('click', async () => {
      const targetUrl = urlInput.value.trim();

      if (!validateUrl(targetUrl)) {
        setUrlValid(false);
        urlInput.focus();
        return;
      }
      setUrlValid(true);

      const selected = [...checkboxes]
        .filter(cb => cb.checked)
        .map(cb => cb.labels[0].firstChild.textContent.trim());

      status.textContent = `Running ${selected.length} check${selected.length > 1 ? 's' : ''}: ${selected.join(', ')}.`;
      runBtn.textContent = 'Running\u2026';
      runBtn.disabled = true;
      resultsSection.hidden = true;

      try {
        const resp = await fetch(`${PROXY_URL}?url=${encodeURIComponent(targetUrl)}`);
        const data = await resp.json();

        renderResults(data);
        resultsSection.hidden = false;
        status.textContent = 'Checks complete. Review results below.';
      } catch (err) {
        resultsContent.innerHTML = `
          <p class="results-error">
            Could not reach the local proxy at ${escHtml(PROXY_URL)}.<br>
            Make sure <code>proxy.py</code> is running: <code>python proxy.py</code>
          </p>`;
        resultsSection.hidden = false;
        status.textContent = 'Check failed. See error message below.';
      } finally {
        runBtn.textContent = 'Run Checks';
        updateRunButton();
      }
    });

    cancelBtn.addEventListener('click', () => {
      status.textContent = 'Dialog cancelled.';
    });

    // Trap focus inside dialog
    const dialog = document.querySelector('[role="dialog"]');
    const focusable = () =>
      [...dialog.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])')].filter(
        el => !el.disabled
      );

    dialog.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const els = focusable();
      const first = els[0];
      const last = els[els.length - 1];

      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    // Set initial focus on URL input
    urlInput.focus();
  </script>

</body>
</html>
