<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessibility Checking Agent</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Backdrop behind dialog */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Dialog container */
    [role="dialog"] {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* Header */
    .dialog-header {
      background: #1a56db;
      color: #ffffff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dialog-header svg {
      flex-shrink: 0;
    }

    .dialog-title {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Body */
    .dialog-body {
      padding: 24px;
    }

    .dialog-description {
      font-size: 0.875rem;
      color: #4b5563;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Checkbox group */
    fieldset {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 4px 0;
    }

    legend {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      padding: 0 16px;
      margin-bottom: 4px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .check-item:hover {
      background: #eff6ff;
    }

    /* Divider between items */
    .check-item + .check-item {
      border-top: 1px solid #f3f4f6;
    }

    /* Custom checkbox */
    .check-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #9ca3af;
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      background: #fff;
      transition: border-color 0.15s, background 0.15s;
    }

    .check-item input[type="checkbox"]:checked {
      background: #1a56db;
      border-color: #1a56db;
    }

    .check-item input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 0px;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .check-item input[type="checkbox"]:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .check-item label {
      font-size: 0.9375rem;
      color: #111827;
      cursor: pointer;
      flex: 1;
      line-height: 1.4;
    }

    .check-item label .label-hint {
      display: block;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Footer */
    .dialog-footer {
      padding: 16px 24px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 9px 20px;
      border-radius: 7px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .btn:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .btn-primary {
      background: #1a56db;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1648c0;
      box-shadow: 0 2px 8px rgba(26, 86, 219, 0.4);
    }

    .btn-primary:disabled {
      background: #93c5fd;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Live region for status announcements */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="dialog-backdrop">
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-desc"
    >

      <!-- Header -->
      <div class="dialog-header">
        <svg
          aria-hidden="true"
          focusable="false"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4l3 3"/>
        </svg>
        <h1 class="dialog-title" id="dialog-title">Accessibility Checking Agent</h1>
      </div>

      <!-- Body -->
      <div class="dialog-body">
        <p class="dialog-description" id="dialog-desc">
          Select one or more accessibility checks to run against the target page.
          Results will be generated after you click <strong>Run Checks</strong>.
        </p>

        <fieldset>
          <legend>Accessibility Tests</legend>

          <div class="check-item">
            <input type="checkbox" id="chk-color-contrast" name="checks" value="color-contrast" checked />
            <label for="chk-color-contrast">
              Color Contrast
              <span class="label-hint">Verifies text meets WCAG AA/AAA contrast ratios (SC 1.4.3, 1.4.6)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-keyboard-traps" name="checks" value="keyboard-traps" />
            <label for="chk-keyboard-traps">
              Keyboard Traps
              <span class="label-hint">Ensures focus is never locked inside a component (SC 2.1.2)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-alt-text" name="checks" value="alt-text" />
            <label for="chk-alt-text">
              Alt-text for Images
              <span class="label-hint">Checks that all &lt;img&gt; elements have meaningful alt attributes (SC 1.1.1)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-desc-images" name="checks" value="desc-images" />
            <label for="chk-desc-images">
              Description for Images
              <span class="label-hint">Validates long descriptions for complex images via aria-describedby (SC 1.1.1)</span>
            </label>
          </div>

          <div class="check-item">
            <input type="checkbox" id="chk-skip-link" name="checks" value="skip-link" />
            <label for="chk-skip-link">
              Skip to Content Link
              <span class="label-hint">Confirms a visible skip-navigation link is the first focusable element (SC 2.4.1)</span>
            </label>
          </div>
        </fieldset>
      </div>

      <!-- Footer -->
      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-run">Run Checks</button>
      </div>

    </div>
  </div>

  <!-- Live region: screen readers announce status changes -->
  <div aria-live="polite" aria-atomic="true" class="sr-only" id="status"></div>

  <script>
    const checkboxes = document.querySelectorAll('input[name="checks"]');
    const runBtn = document.getElementById('btn-run');
    const cancelBtn = document.getElementById('btn-cancel');
    const status = document.getElementById('status');

    // Keep Run button disabled when nothing is selected
    function updateRunButton() {
      const anyChecked = [...checkboxes].some(cb => cb.checked);
      runBtn.disabled = !anyChecked;
    }

    checkboxes.forEach(cb => cb.addEventListener('change', updateRunButton));
    updateRunButton();

    runBtn.addEventListener('click', () => {
      const selected = [...checkboxes]
        .filter(cb => cb.checked)
        .map(cb => cb.labels[0].firstChild.textContent.trim());

      status.textContent = `Running ${selected.length} check${selected.length > 1 ? 's' : ''}: ${selected.join(', ')}.`;
      runBtn.textContent = 'Running…';
      runBtn.disabled = true;

      // Simulate async work; replace with real agent call
      setTimeout(() => {
        runBtn.textContent = 'Run Checks';
        updateRunButton();
        status.textContent = 'Checks complete. Review results below.';
      }, 2000);
    });

    cancelBtn.addEventListener('click', () => {
      status.textContent = 'Dialog cancelled.';
    });

    // Trap focus inside dialog
    const dialog = document.querySelector('[role="dialog"]');
    const focusable = () =>
      [...dialog.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])')].filter(
        el => !el.disabled
      );

    dialog.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const els = focusable();
      const first = els[0];
      const last = els[els.length - 1];

      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    // Set initial focus on first interactive element
    focusable()[0]?.focus();
  </script>

</body>
</html>
